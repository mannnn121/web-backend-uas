services:
  database:
    image: mariadb:11.4
    container_name: pos_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: pos_db
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pos-network

  backend:
    image: ghcr.io/mannnn121/pos-backend:${TAG:-latest}
    build: ./backend
    container_name: pos_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MARIADB_ROOT_PASSWORD}@database:3306/pos_db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-${PUBLIC_URL:-http://localhost}}
      PORT: 3000
    networks:
      - pos-network

  frontend:
    image: ghcr.io/mannnn121/pos-frontend:${TAG:-latest}
    build: ./frontend
    container_name: pos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - pos-network

  proxy:
    image: nginx:1.27-alpine
    container_name: pos_proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pos-network

  phpmyadmin:
    image: phpmyadmin:5
    container_name: pos_phpmyadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - pos-network

volumes:
  mariadb_data:
    name: pos_mariadb_migration_data

networks:
  pos-network:
    name: pos-network
    driver: bridge
