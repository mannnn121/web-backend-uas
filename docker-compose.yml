services:
  database:
    image: mariadb:11.4
    container_name: pos_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: pos_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pos-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pos_phpmyadmin
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - pos-network

  backend:
    build: ./backend
    container_name: pos_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:${MARIADB_ROOT_PASSWORD}@database:3306/pos_db"
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-pos-uas}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    networks:
      - pos-network

  frontend:
    build: ./frontend
    container_name: pos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3001"
    networks:
      - pos-network

volumes:
  mariadb_data:
    name: pos_mariadb_migration_data

networks:
  pos-network:
    name: pos-network
    driver: bridge
